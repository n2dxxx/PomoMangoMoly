<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Phiên Làm Việc</title>
<meta name="theme-color" content="#E8601C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: bàn làm việc hai cột — trái là đồng hồ + hộp ghi nhanh (cố định khi cuộn), phải là danh sách việc / ghi chú / thống kê theo tab. Điện thoại: xếp một cột. */
:root{
  --paper:#F4F2F0; --surface:#FFFFFF; --sunk:#F6F4F2; --ink:#17120F; --muted:#746B64; --line:#EAE5E1;
  --accent:#E8601C; --accent-soft:#FDEBDD; --accent-ink:#B0430D; --brk1:#FFF5EC; --brk2:#FFE2CC; --brk-ink:#3A1A08;
  --tomato:#C9302C; --tomato-soft:#FBE3E1; --leaf:#2F8F62; --leaf-soft:#E2F2EA; --amber:#B07419; --amber-soft:#FBF0DB;
  --shadow:0 2px 4px rgba(40,24,12,.04),0 16px 32px -18px rgba(40,24,12,.18); --shadow-sm:0 1px 2px rgba(40,24,12,.04),0 6px 16px -12px rgba(40,24,12,.12);
  --f-display:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12100E; --surface:#1B1815; --sunk:#24201C; --ink:#F1EBE5; --muted:#A49A91; --line:#302A25;
  --accent:#FF8240; --accent-soft:#3A1F10; --accent-ink:#FFB287; --brk1:#3A2416; --brk2:#23150C; --brk-ink:#FFEADB;
  --tomato:#FF5E57; --tomato-soft:#3A1715; --leaf:#4CC38A; --leaf-soft:#15301F; --amber:#E7B04E; --amber-soft:#33280F;
  --shadow:0 2px 4px rgba(0,0,0,.3),0 16px 32px -18px rgba(0,0,0,.7); --shadow-sm:0 1px 2px rgba(0,0,0,.3),0 6px 16px -12px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12100E; --surface:#1B1815; --sunk:#24201C; --ink:#F1EBE5; --muted:#A49A91; --line:#302A25;
  --accent:#FF8240; --accent-soft:#3A1F10; --accent-ink:#FFB287; --brk1:#3A2416; --brk2:#23150C; --brk-ink:#FFEADB;
  --tomato:#FF5E57; --tomato-soft:#3A1715; --leaf:#4CC38A; --leaf-soft:#15301F; --amber:#E7B04E; --amber-soft:#33280F;
  --shadow:0 2px 4px rgba(0,0,0,.3),0 16px 32px -18px rgba(0,0,0,.7); --shadow-sm:0 1px 2px rgba(0,0,0,.3),0 6px 16px -12px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
form{margin:0}
[hidden]{display:none!important}
html,body{background:var(--paper);color:var(--ink)}
body{font:15px/1.5 var(--f-body);padding-inline:16px;padding-block:20px 60px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}}
.left{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:14px}
@media (max-width:860px){.left{position:static}}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{font:700 22px/1.1 var(--f-display);letter-spacing:-.01em;margin:0}
.save-state{font-size:12px;color:var(--muted)}
.save-state.err{color:var(--tomato)}

/* Timer */
.timer{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;--mode:var(--tomato);--mode-soft:var(--tomato-soft)}
.timer[data-kind="break"]{--mode:var(--leaf);--mode-soft:var(--leaf-soft)}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.mode{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.mode[aria-pressed="true"]{background:var(--mode-soft);border-color:transparent;color:var(--mode);font-weight:600}
.mode:disabled{cursor:default}
.ring-wrap{position:relative;width:min(230px,70vw);aspect-ratio:1;margin:0 auto;max-width:100%}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--sunk);stroke-width:10}
.ring-fg{fill:none;stroke:var(--mode);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.clock-box{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.clock{font:700 56px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.clock-sub{font-size:13px;color:var(--muted)}
.paused .clock{opacity:.45}
.field-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:4px}
select,input[type=text],input[type=number],input[type=date],input[type=search],textarea{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{resize:vertical;line-height:1.55}
.task-progress{font-size:13px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--mode,var(--tomato));border-color:transparent;color:#fff;flex:1;font-weight:600}
.btn.primary.solid{background:var(--tomato)}
.btn.ghost{background:transparent}
.btn.small{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--tomato)}
.stop-panel{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}

/* Alert */
.alert{border-radius:14px;padding:14px 16px;background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);display:flex;flex-direction:column;gap:10px}
.alert.hard{background:var(--tomato-soft);border-color:color-mix(in srgb,var(--tomato) 35%,transparent)}
.alert h3{margin:0;font:600 15px/1.35 var(--f-body);text-wrap:balance}
.alert .nums{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.alert .q{font-size:13px;font-style:italic;color:var(--muted)}

/* Quote */
.quote{padding:6px 4px 0}
.quote blockquote{margin:0;font:500 18px/1.4 var(--f-display);text-wrap:balance}
.quote .by{font-size:13px;color:var(--muted);margin-top:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-size:12px}
.focus-note{font-size:14px;color:var(--muted);padding:6px 4px 0}
.focus-note strong{color:var(--ink)}

/* Inbox */
.inbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.inbox h2{margin:0;font:600 14px/1.3 var(--f-body)}
.inbox .hint{font-size:12px;color:var(--muted);margin:0}
.inbox ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.inbox li{display:flex;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:6px;flex-wrap:wrap}
.inbox li span{flex:1;min-width:0;overflow-wrap:anywhere}
.inbox .acts{display:flex;gap:4px}

/* Right */
.right{min-width:0;display:flex;flex-direction:column;gap:16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .count{font-family:var(--f-mono);font-size:11px;background:var(--sunk);border-radius:6px;padding:1px 5px;margin-left:4px}
h2.sec{font:700 20px/1.2 var(--f-display);margin:0}
h3.sub{font:600 13px/1.3 var(--f-body);margin:6px 0 0;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.budget{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.budget .row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.budget .big{font:700 26px/1 var(--f-display)}
.budget .lbl{font-size:12px;color:var(--muted)}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.warn{color:var(--amber);font-size:13px}

.add{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:end}
.add .more{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
@media (max-width:520px){.add{grid-template-columns:minmax(0,1fr) auto}.add .addbtn{grid-column:1/-1}}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.stepper button{background:none;border:0;width:30px;height:36px;cursor:pointer;font-size:16px;color:var(--muted)}
.stepper output{min-width:48px;text-align:center;font-family:var(--f-mono);font-size:13px}
.check{display:flex;gap:6px;align-items:center;font-size:14px;cursor:pointer}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.task.active{border-color:var(--accent)}
.task.done{opacity:.6}
.task.done .t-title{text-decoration:line-through}
.box{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.box:hover{border-color:var(--leaf)}
.task.done .box{background:var(--leaf);border-color:var(--leaf)}
.box svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:3;opacity:0}
.task.done .box svg{opacity:1}
.t-title{font-weight:500;overflow-wrap:anywhere;cursor:pointer}
.t-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-top:3px}
.pill{border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--leaf-soft);color:var(--leaf)}
.pill.near{background:var(--amber-soft);color:var(--amber)}
.pill.over{background:var(--tomato-soft);color:var(--tomato)}
.pill.stale{background:var(--sunk);color:var(--muted);border:1px dashed var(--muted)}
.tag{background:var(--sunk);border-radius:6px;padding:0 6px}
.prio-3{color:var(--tomato);font-weight:600}
.overdue{color:var(--tomato);font-weight:600}
.pomos{display:flex;gap:3px;align-items:center;margin-top:6px;flex-wrap:wrap}
.pomo{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);position:relative;overflow:hidden}
.pomo i{position:absolute;inset:0;background:var(--tomato);transform-origin:left}
.pomo.extra{border-color:var(--tomato);border-style:dashed}
.pomos .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:6px}
.t-act{display:flex;gap:4px}
.icon{width:34px;height:34px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.icon:hover{border-color:var(--line);color:var(--ink)}
.icon.on{color:var(--amber)}
.icon.play{color:var(--tomato)}
.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:520px){.task{grid-template-columns:auto minmax(0,1fr)}.t-act{grid-column:2;justify-content:flex-start}}

.empty{border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty strong{color:var(--ink);font-family:var(--f-display);font-size:17px}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filters select{width:auto}
.seg{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
.seg[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* Inline subtasks */
.subs-inline{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.prog{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prog .bar{flex:1;min-width:120px;height:6px}
.prog .bar span{background:var(--leaf)}
.prog .pl{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog .pl b{color:var(--ink);font-weight:600}
.sl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.sl li{display:flex;align-items:center;gap:8px;font-size:14px;padding:2px 4px;border-radius:6px}
.sl li:hover{background:var(--sunk)}
.sl label{flex:1;min-width:0;display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.sl label span{overflow-wrap:anywhere}
.sl input[type=checkbox]{margin-top:3px;accent-color:var(--leaf)}
.sl li.done label span{text-decoration:line-through;color:var(--muted)}
.sl .w{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.sl .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0 4px;opacity:0}
.sl li:hover .x,.sl .x:focus-visible{opacity:1}
@media (hover:none){.sl .x{opacity:1}}
.sadd input{background:transparent;border:1px dashed transparent;padding:4px 6px;font-size:14px;color:var(--muted)}
.sadd input:hover{border-color:var(--line)}
.sadd input:focus{border-style:solid;border-color:var(--line);background:var(--paper);color:var(--ink)}

/* Matrix */
:root{--q1:var(--tomato);--q2:var(--leaf);--q3:var(--amber);--q4:#8E9A93;--q1s:var(--tomato-soft);--q2s:var(--leaf-soft);--q3s:var(--amber-soft);--q4s:var(--sunk)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--q4:#7F8C86}}
:root[data-theme="dark"]{--q4:#7F8C86}
.q1{--qc:var(--q1);--qs:var(--q1s)}.q2{--qc:var(--q2);--qs:var(--q2s)}.q3{--qc:var(--q3);--qs:var(--q3s)}.q4{--qc:var(--q4);--qs:var(--q4s)}.q0{--qc:var(--muted);--qs:transparent}.qn{--qc:var(--line)}
.qb{border:1px solid color-mix(in srgb,var(--qc) 40%,transparent);background:var(--qs);color:var(--qc);border-radius:6px;padding:0 7px;font-size:11.5px;font-weight:600;cursor:pointer;line-height:1.6}
.q0.qb{border-style:dashed}
.slip{font-size:11.5px;color:var(--tomato);border-bottom:1px dotted var(--tomato)}
.task,.mitem{position:relative}
.qmenu{position:absolute;z-index:15;top:calc(100% - 6px);left:40px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px;width:min(280px,calc(100vw - 48px))}
.mitem .qmenu{left:auto;right:0}
.qm{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:none;border:0;border-left:3px solid var(--qc);border-radius:6px;padding:6px 10px;cursor:pointer}
.qm:hover,.qm:focus-visible{background:var(--sunk)}
.qm[aria-current]{background:var(--qs)}
.qm b{font-size:13.5px}.qm span{font-size:12px;color:var(--muted)}
.qnote{margin:4px 6px 2px;font-size:12px;color:var(--muted)}
.alloc{display:flex;flex-direction:column;gap:6px}
.alloc-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px}
.alloc-h span{color:var(--muted)}
.abar{display:flex;height:14px;border-radius:4px;overflow:hidden;gap:2px;background:var(--sunk)}
.abar span{background:var(--qc);min-width:3px}
.abar .empty-bar{flex:1;background:transparent}
.alegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.alegend i{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--qc);margin-right:5px}
.alegend b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.matrix{display:grid;grid-template-columns:22px minmax(0,1fr);grid-template-rows:auto auto;gap:6px 8px}
.axis-top{grid-column:2;display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center}
.axis-side{grid-row:2;display:grid;grid-template-rows:1fr 1fr;gap:12px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.axis-side span{writing-mode:vertical-rl;transform:rotate(180deg);text-align:center}
.mgrid{grid-row:2;grid-column:2;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mcell{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--qc);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:170px;transition:background .12s}
.mcell.over{background:var(--qs);outline:2px dashed var(--qc);outline-offset:-4px}
.mcell header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
.mcell h3{margin:0;font:700 16px/1.2 var(--f-display);color:var(--qc)}
.mcell.q0 h3{color:var(--ink)}
.mh{font-size:12px;color:var(--muted)}
.mcount{font-size:12px;font-family:var(--f-mono);color:var(--muted);white-space:nowrap}
.mtip{margin:0;font-size:12.5px;color:var(--muted)}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mitem{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 10px;cursor:grab}
.mitem.dragging{opacity:.4}
.mi-main{min-width:0;display:flex;flex-direction:column}
.mi-title{font-size:14px;font-weight:500;overflow-wrap:anywhere;cursor:pointer}
.mi-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tday{color:var(--amber);font-weight:600}
.mempty{font-size:13px;color:var(--muted);padding:6px 0}
.tray{border-top-style:dashed;min-height:0}
@media (max-width:640px){.mgrid{grid-template-columns:minmax(0,1fr)}.matrix{grid-template-columns:minmax(0,1fr)}.axis-top,.axis-side{display:none}.mgrid{grid-column:1}}

.qpick-wrap{grid-column:1/-1}
.qpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.qp{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:1px;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--qc);border-radius:8px;padding:6px 10px;cursor:pointer;min-width:0}
.qp b{font-size:13px;color:var(--qc)}.qp.q0 b{color:var(--ink)}
.qp span{font-size:11.5px;color:var(--muted)}
.qp:hover{border-color:var(--qc)}

/* ---------- timer ---------- */
function startMode(mode, taskId) {
  const tm = S.timer;
  Object.assign(tm, { mode, running: true, startedAt: Date.now(), durMs: modeMs(mode), pausedAt: 0, pausedTotal: 0 });
  if (mode === 'focus') {
    tm.taskId = taskId ?? tm.taskId ?? '';
    const t = S.tasks[tm.taskId];
    if (t) {
      let ch = false;
      if (t.status === 'todo') { t.status = 'doing'; ch = true; }
      if (!t.startedAt) { t.startedAt = Date.now(); ch = true; }
      if (!t.today) { t.today = true; ch = true; }
      if (ch) saveTask(t);
    }
    UI.stopOpen = false;
  } else {
    pickQuote('break');
  }
  saveTimer(); renderAll(); primeAudio();
}
function togglePause() {
  const tm = S.timer; if (!tm.running) return;
  if (tm.pausedAt) { tm.pausedTotal += Date.now() - tm.pausedAt; tm.pausedAt = 0; }
  else tm.pausedAt = Date.now();
  saveTimer(); renderTimer();
}
function logSession(taskId, ms, done, reason) {
  const d = dayStr(new Date(S.timer.startedAt || Date.now()));
  const day = S.days[d] || (S.days[d] = { date: d, sessions: [] });
  const t = S.tasks[taskId];
  day.sessions.push({ taskId: taskId || '', title: t ? t.title : '', start: S.timer.startedAt, ms: Math.round(ms), done, reason: reason || '', q: t ? quadOf(t) : 0 });
  Store.save('day', d, day);
}
function endFocus(completed, reason, noAuto) {
  const tm = S.timer;
  const ms = Math.min(elapsed(), tm.durMs);
  const t = S.tasks[tm.taskId];
  if (t) { t.spentMs = (t.spentMs || 0) + ms; saveTask(t); }
  logSession(tm.taskId, ms, completed, reason);
  tm.running = false; tm.pausedAt = 0; tm.pausedTotal = 0;
  UI.stopOpen = false;
  if (completed) {
    tm.cycle = (tm.cycle || 0) + 1;
    const next = tm.cycle % S.settings.longEvery === 0 ? 'long' : 'short';
    chime(3);
    if (S.settings.autoBreak && !noAuto) { startMode(next); toast(`Xong một phiên tập trung${t ? ` cho “${t.title}”` : ''}. Nghỉ ${next === 'long' ? S.settings.long : S.settings.short} phút nhé.`); return; }
    tm.mode = next; pickQuote('break');

    tm.mode = 'focus';
  }

}
function endBreak(skipped) {

  if (!skipped) { chime(2); toast('Hết giờ nghỉ. Sẵn sàng cho phiên tiếp theo.'); }
  saveTimer(); renderAll();
}
function switchTaskAndStart(taskId) {

    if (tm.taskId === taskId) return;
    const ms = Math.min(elapsed(), tm.durMs);
    const t = S.tasks[tm.taskId];
    if (t) { t.spentMs = (t.spentMs || 0) + ms; saveTask(t); }
    logSession(tm.taskId, ms, false, 'Chuyển việc');
  }
  startMode('focus', taskId);
}

/* ---------- overrun reminders ---------- */
const LEVELS = [0.8, 1, 1.5];
function checkOverrun() {
  const tm = S.timer;
  if (!(tm.running && tm.mode === 'focus' && !tm.pausedAt)) return;
  const t = S.tasks[tm.taskId]; if (!t || !t.est || t.status === 'done') return;
  const p = pct(t); t.alerts = t.alerts || {};
  for (let i = LEVELS.length - 1; i >= 0; i--) {
    const k = String(LEVELS[i]);
    if (p >= LEVELS[i] && !t.alerts[k]) {
      LEVELS.forEach(l => { if (l <= LEVELS[i]) t.alerts[String(l)] = true; });
      saveTask(t);
      if (LEVELS[i] < 1) {
        const left = estMs(t) - liveSpent(t);
        toast(`“${t.title}” đã dùng ${Math.round(p * 100)}% thời gian dự kiến. Còn khoảng ${fmtMin(left)} theo kế hoạch.`);
        chime(1);
      } else {
        UI.alert = { taskId: t.id, level: LEVELS[i], q: randomQuote(['uoc-luong', 'kien-nhan']) };
        chime(2); renderAlert(); renderView();
      }
      break;
    }
  }
}
function resetAlerts(t) {
  const p = pct(t); t.alerts = {};
  LEVELS.forEach(l => { if (p >= l) t.alerts[String(l)] = true; });
}
function alertAction(action, extra) {
  const a = UI.alert; if (!a) return;
  const t = S.tasks[a.taskId]; if (!t) { UI.alert = null; renderAlert(); return; }
  const label = { reest: `Ước lượng lại thành ${extra} phiên`, split: 'Chia nhỏ', park: 'Tạm gác', cont: 'Tiếp tục' }[action];
  t.log = t.log || []; t.log.push({ at: Date.now(), pct: Math.round(pct(t) * 100), action: label });
  if (action === 'reest') { t.est = extra; t.pomoMin = S.settings.focus; resetAlerts(t); }
  saveTask(t);
  UI.alert = null; renderAlert();
  if (action === 'split') openDrawer(t.id, 'subs');
  if (action === 'park') {
    t.today = false; t.status = 'todo'; saveTask(t);
    if (S.timer.running && S.timer.mode === 'focus' && S.timer.taskId === t.id) endFocus(false, 'Tạm gác');
    toast(`Đã gác “${t.title}” khỏi danh sách hôm nay.`);
  }
  renderAll();
}

/* ---------- quotes ---------- */
function quotePool(themes) {
  const st = S.settings;
  const own = (st.customQuotes || []).map(q => ({ ...q, th: 'own' }));
  const th = themes || st.themes;
  let pool = QUOTES.filter(q => th.includes(q.th)).concat(own).filter(q => !(st.hiddenQuotes || []).includes(q.id));
  if (!pool.length) pool = QUOTES.concat(own).filter(q => !(st.hiddenQuotes || []).includes(q.id));
  return pool;
}
function randomQuote(themes) {
  const pool = quotePool(themes); if (!pool.length) return null;
  const fresh = pool.filter(q => !UI.recentQ.includes(q.id));
  const src = fresh.length ? fresh : pool;
  const q = src[Math.floor(Math.random() * src.length)];
  UI.recentQ.push(q.id); if (UI.recentQ.length > 6) UI.recentQ.shift();
  return q;
}
function pickQuote() { UI.quote = randomQuote(); }

/* ---------- sound ---------- */
let AC = null;
function primeAudio() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {} }
function chime(n) {
  if (!S.settings.sound || !AC) return;
  try {
    for (let i = 0; i < n; i++) {
      const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + i * 0.35;
      o.type = 'sine'; o.frequency.value = i % 2 ? 660 : 880;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.3);
      o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + 0.32);
    }
  } catch (e) {}
}

function statusPill(t) {

    <div class="dcols" role="img" aria-label="Số phiên trọn vẹn 7 ngày: ${vals.join(', ')}">${days.map((d, i) => `<div class="dcol${i === 6 ? ' today' : ''}"><span class="v">${vals[i]}</span><div class="stack">${Array.from({ length: Math.min(max, 16) }, (_, k) => `<i class="${k < vals[i] ? 'on' : ''}"></i>`).join('')}</div><span class="d">${i === 6 ? 'Nay' : wd[new Date(d + 'T00:00').getDay()]}</span></div>`).join('')}</div>
    <p class="note">Mỗi ô vuông là một phiên tập trung trọn vẹn${max > 16 ? ' (cột hiển thị tối đa 16 ô, con số phía trên là số thật)' : ''}. Tổng ${vals.reduce((a, b) => a + b, 0)} phiên, tính cả các ngày không mở ứng dụng (0).</p></div>`;
  const reasons = {};
  let broken = 0, total = 0;
  Object.values(S.days).filter(d => d.date >= dayStr(daysAgo(29))).forEach(d => d.sessions.forEach(s => { total++; if (!s.done && s.reason && s.reason !== 'Chuyển việc' && s.reason !== 'Hoàn thành sớm' && s.reason !== 'Tạm gác') { broken++; reasons[s.reason] = (reasons[s.reason] || 0) + 1; } }));
  const rs = Object.entries(reasons).sort((a, b) => b[1] - a[1]);
  h += `<div class="card"><h3>Lý do bị ngắt, 30 ngày</h3>${rs.length ? `<div class="tbl-wrap"><table><thead><tr><th>Lý do</th><th class="num">Lần</th></tr></thead><tbody>${rs.map(([r, n]) => `<tr><td>${esc(r)}</td><td class="num">${n}</td></tr>`).join('')}</tbody></table></div><p class="note">${broken} trên ${total} phiên bị dừng giữa chừng.</p>` : `<p class="note">Chưa có phiên nào bị dừng giữa chừng. Khi bạn bấm “Dừng phiên” và chọn lý do, thống kê sẽ hiện ở đây.</p>`}</div></div>`;
  const done = Object.values(S.tasks).filter(t => t.status === 'done' && t.est > 0 && t.spentMs > 0);
  const groups = {};
  done.forEach(t => { const g = t.tag || '(không tag)'; (groups[g] = groups[g] || []).push(t.spentMs / estMs(t)); });
  const rows = Object.entries(groups).sort((a, b) => b[1].length - a[1].length);
  const allR = done.map(t => t.spentMs / estMs(t));
  h += `<div class="card"><h3>Độ chính xác ước lượng</h3>
    <p class="note">Tỉ lệ = thời gian thực làm ÷ thời gian dự kiến, chỉ tính việc đã xong có ước lượng. 1.0× là đúng dự kiến, trên 1 là làm lâu hơn. Nhóm dưới 10 việc được đánh dấu vì mẫu còn nhỏ, chưa nên dựa vào để kết luận.</p>
    ${rows.length ? `<div class="tbl-wrap"><table><thead><tr><th>Tag</th><th class="num">Số việc</th><th class="num">Trung vị</th><th class="num">Trong khoảng ±20%</th></tr></thead><tbody>
      ${rows.map(([g, a]) => `<tr><td>${esc(g)}${a.length < 10 ? ' <span class="lowdata">· mẫu nhỏ</span>' : ''}</td><td class="num">${a.length}</td><td class="num">${median(a).toFixed(2)}×</td><td class="num">${Math.round(a.filter(r => r >= 0.8 && r <= 1.2).length / a.length * 100)}%</td></tr>`).join('')}
      <tr><td><strong>Tất cả</strong>${allR.length < 10 ? ' <span class="lowdata">· mẫu nhỏ</span>' : ''}</td><td class="num">${allR.length}</td><td class="num">${median(allR).toFixed(2)}×</td><td class="num">${Math.round(allR.filter(r => r >= 0.8 && r <= 1.2).length / allR.length * 100)}%</td></tr>
    </tbody></table></div>` : `<p class="note">Chưa có việc nào vừa có ước lượng vừa đã xong.</p>`}</div>`;
  const logs = [];
  Object.values(S.tasks).forEach(t => (t.log || []).forEach(l => logs.push({ ...l, title: t.title })));
  logs.sort((a, b) => b.at - a.at);
  h += `<div class="card"><h3>Bạn đã xử lý lời nhắc quá giờ thế nào</h3>${logs.length ? `<div class="tbl-wrap"><table><thead><tr><th>Việc</th><th>Lựa chọn</th><th class="num">Lúc đó</th></tr></thead><tbody>${logs.slice(0, 12).map(l => `<tr><td>${esc(l.title)}</td><td>${esc(l.action)}</td><td class="num">${l.pct}%</td></tr>`).join('')}</tbody></table></div>` : '<p class="note">Chưa có lời nhắc nào.</p>'}</div>`;
  return h;
}

    <div><span class="field-label">Các bước nhỏ</span><ul class="subs" id="dSubs"></ul>

function renderSubs() {

}
function closeDrawer() { $('#drawerRoot').innerHTML = ''; drawerId = ''; renderView(); }

/* ---------- view dispatch ---------- */
function renderTabs() {
  $$('.tab').forEach(b => {
    b.setAttribute('aria-selected', String(b.dataset.tab === UI.tab));
    if (b.dataset.tab === 'today') { const n = Object.values(S.tasks).filter(t => t.today && t.status !== 'done').length; b.innerHTML = `Hôm nay${n ? `<span class="count">${n}</span>` : ''}`; }
  });
}
function renderView() {
  const v = $('#view');
  // keep note editor focus when re-rendering unrelated parts
  if (UI.tab === 'notes' && v.contains(document.activeElement) && document.activeElement.matches('#noteSearch')) return;
  if (v.contains(document.activeElement) && document.activeElement.matches('#addTitle,#addTag,#qText,#qBy,input[type=number]')) { refreshLists(); return; }
  const f = { today: viewToday, all: viewAll, notes: viewNotes, matrix: viewMatrix, stats: viewStats, settings: viewSettings }[UI.tab] || viewToday;
  v.innerHTML = f();
}
function refreshLists() {
  renderHello();
  // update only task lists in place (to keep form input focus)
  if (UI.tab !== 'today' && UI.tab !== 'all') { if (UI.tab === 'matrix') $('#view').innerHTML = viewMatrix(); return; }
  const tmp = document.createElement('div'); tmp.innerHTML = UI.tab === 'today' ? viewToday() : viewAll();
  const cur = $$('#view .list'), nxt = $$('.list', tmp);
  cur.forEach((ul, i) => { if (nxt[i]) ul.innerHTML = nxt[i].innerHTML; });
  const b = $('#view .budget'), nb = $('.budget', tmp); if (b && nb) b.innerHTML = nb.innerHTML;
  const hs = $$('#view h3.sub'), nhs = $$('h3.sub', tmp);
  if (hs.length !== nhs.length || cur.length !== nxt.length) { $('#view').replaceChildren(...tmp.childNodes); return; }
  hs.forEach((h, i) => { h.textContent = nhs[i].textContent; });
}
function renderHello() {
  const el = $('#hello'); if (!el) return;
  const h = new Date().getHours();
  const greet = h < 11 ? 'Chào buổi sáng' : h < 14 ? 'Chào buổi trưa' : h < 18 ? 'Chào buổi chiều' : 'Chào buổi tối';
  const dn = Store.fbUser && Store.fbUser.displayName ? Store.fbUser.displayName.trim().split(/\s+/).pop() : '';
  const today = sortTasks(openTasks().filter(t => t.today));
  const left = today.reduce((s, t) => s + Math.max(0, (t.est || 0) - liveSpent(t) / pomoMs(t)), 0);
  const d = S.days[dayStr()], done = d ? d.sessions.filter(x => x.done).length : 0, budget = S.settings.budget;
  const noEst = today.filter(t => !t.est).length, over = done + left - budget;
  const notes = [over > 0 ? `<span class="warn-t">Vượt quỹ ${over.toFixed(1)} phiên</span>` : '', noEst ? `<span>${noEst} việc chưa ước lượng</span>` : ''].filter(Boolean).join(' · ');
  el.innerHTML = `<div class="hello-l"><h2>${greet}${dn ? ', ' + esc(dn) : ''}</h2><p>${today.length ? `<b>${today.length} việc</b> hôm nay · còn khoảng <b>${left.toFixed(1)} phiên</b>` : 'Chưa có việc nào cho hôm nay.'}</p></div>
    <div class="hello-r"><div class="hb-top"><span><b>${done}</b>/${budget} phiên đã xong</span>${notes ? `<span class="hb-note">${notes}</span>` : ''}</div>${budgetDots(done, left, budget, true)}</div>`;
}
function budgetDots(done, left, budget, compact) {
  const plan = Math.max(0, Math.ceil(left - 1e-9));
  const total = Math.min(40, Math.max(budget, done + plan));
  let d = '';
  for (let i = 0; i < total; i++) {
    const cls = i < done ? 'done' : i < done + plan ? 'plan' : '';
    d += `<i class="${cls}${cls && i >= budget ? ' over' : ''}"></i>`;
  }
  const over = done + plan > budget;
  const dotsHtml = `<div class="dots" role="img" title="Cam đậm: đã xong · Cam nhạt: còn theo dự kiến · Đỏ: vượt quỹ · Xám: quỹ còn trống" aria-label="Đã xong ${done} phiên, còn ${plan} phiên theo dự kiến, quỹ ${budget} phiên">${d}</div>`;
  if (compact) return dotsHtml;
  return `${dotsHtml}
    <div class="dot-legend"><span><i style="background:var(--accent)"></i>Đã xong</span><span><i style="background:color-mix(in srgb,var(--accent) 28%,var(--surface));border:1px solid var(--accent)"></i>Còn theo dự kiến</span>${over ? '<span><i style="background:var(--tomato)"></i>Vượt quỹ</span>' : ''}<span><i style="background:var(--sunk);border:1px solid var(--line)"></i>Quỹ còn trống</span></div>`;
}
function renderAll() { renderHello(); renderTabs(); renderTimer(); renderAlert(); renderView(); }

const view = $('#view');
view.addEventListener('click', e => {
  const el = e.target;
  const qo = el.closest('[data-qopen="a"]'); if (qo) { toggleQMenu(qo, 'a', UI.addQ); return; }
  const qp = el.closest('[data-qpick^="a:"]'); if (qp) { UI.addQ = +qp.dataset.qpick.split(':')[1]; refreshAddQ(); return; }
  const qf = el.closest('[data-qf]'); if (qf) { UI.quadFilter = qf.dataset.qf; renderView(); return; }
  const sq = el.closest('[data-setq]');
  if (sq) { const t = S.tasks[sq.closest('[data-id]').dataset.id]; setQuadrant(t, +sq.dataset.setq); renderAll(); return; }
  const sa = el.closest('[data-sact="del"]');
  if (sa) {
    const t = S.tasks[sa.closest('.task').dataset.id], sid = sa.closest('li').dataset.sid;
    t.subtasks = (t.subtasks || []).filter(x => x.id !== sid); saveTask(t); renderAll(); return;
  }
  const act = el.closest('[data-act]');
  if (act) {
    const id = act.closest('[data-id]').dataset.id, t = S.tasks[id];
    if (act.dataset.act === 'done') toggleDone(id);
    else if (act.dataset.act === 'open') openDrawer(id);
    else if (act.dataset.act === 'play') { primeAudio(); switchTaskAndStart(id); }
    else if (act.dataset.act === 'today') { t.today = !t.today; saveTask(t); if (t.today && quadOf(t) === 4) toast(`“${t.title}” thuộc ô Bỏ bớt. Vẫn đưa vào hôm nay theo ý bạn.`); renderAll(); }
    else if (act.dataset.act === 'quad') {
      const host = act.closest('[data-id]'), had = host.querySelector('.qmenu');
      $$('.qmenu').forEach(m => m.remove());
      if (!had) { host.insertAdjacentHTML('beforeend', quadMenu(t)); const cur = host.querySelector('.qmenu [aria-current]') || host.querySelector('.qmenu button'); cur.focus(); }
    }
    return;
  }
  const step = el.closest('[data-step]');
  if (step) { UI.addEst = Math.max(0, Math.min(16, UI.addEst + +step.dataset.step)); $('#addEst').textContent = UI.addEst ? `${UI.addEst} phiên` : 'Chưa rõ'; return; }
  if (el.closest('#loadEx')) { loadExamples(); return; }
  const f = el.closest('[data-filter]'); if (f) { UI.filter = f.dataset.filter; renderView(); return; }
  if (el.closest('#newNoteCard')) { const n = newNote(); openNote('note', n.id); return; }
  const nk = el.closest('[data-nkind]'); if (nk) { UI.noteKind = nk.dataset.nkind; view.innerHTML = viewNotes(); return; }
  const nb = el.closest('[data-nid]'); if (nb) { openNote(nb.dataset.nk, nb.dataset.nid); return; }
  const dq = el.closest('[data-delq]'); if (dq) { S.settings.customQuotes = S.settings.customQuotes.filter(q => q.id !== dq.dataset.delq); saveSettings(); renderView(); return; }
  if (el.closest('#btnExport')) { const box = $('#exportBox'); box.value = exportData(); box.hidden = false; $('#btnCopyExport').hidden = false; box.select(); return; }
  if (el.closest('#btnCopyExport')) {
    const box = $('#exportBox');
    Promise.resolve().then(() => navigator.clipboard.writeText(box.value)).then(() => toast('Đã sao chép. Mở bản kia, vào Cài đặt và dán vào ô “Nhập dữ liệu”.'), () => { box.select(); toast('Không sao chép tự động được. Đoạn dữ liệu đã được chọn sẵn, bấm Ctrl+C để sao chép.'); });
    return;
  }
  if (el.closest('#btnImport')) {
    try { const n = importData($('#importBox').value.trim()); toast(`Đã nhập ${n.tasks} việc, ${n.notes} ghi chú, lịch sử ${n.days} ngày.`); renderAll(); }
    catch (err) { toast(err.message); }
    return;
  }
  if (el.closest('#btnSignOut')) { firebase.auth().signOut().then(() => location.reload()); return; }
  if (el.closest('#unhideQ')) { S.settings.hiddenQuotes = []; saveSettings(); renderView(); }
});
document.addEventListener('click', e => { if (!e.target.closest('.qmenu,[data-act="quad"],[data-qopen]')) $$('.qmenu').forEach(m => m.remove()); });
view.addEventListener('dragstart', e => { const li = e.target.closest('.mitem'); if (!li) return; e.dataTransfer.setData('text/plain', li.dataset.id); e.dataTransfer.effectAllowed = 'move'; li.classList.add('dragging'); });
view.addEventListener('dragend', e => { const li = e.target.closest('.mitem'); if (li) li.classList.remove('dragging'); $$('.mcell.over').forEach(c => c.classList.remove('over')); });
view.addEventListener('dragover', e => { const c = e.target.closest('.mcell'); if (!c) return; e.preventDefault(); $$('.mcell.over').forEach(x => x !== c && x.classList.remove('over')); c.classList.add('over'); });
view.addEventListener('drop', e => {
  const c = e.target.closest('.mcell'); if (!c) return; e.preventDefault();
  const t = S.tasks[e.dataTransfer.getData('text/plain')]; if (!t) return;
  if (quadOf(t) !== +c.dataset.q) setQuadrant(t, +c.dataset.q);
  renderAll();
});
view.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.classList.contains('madd')) {
    const q = +e.target.dataset.q, inp = e.target.querySelector('input'), v = inp.value.trim(); if (!v) return;
    const t = addTask({ title: v, est: UI.addEst, important: q <= 2, urgentManual: q === 1 || q === 3 });
    renderAll(); const again = $(`#view .madd[data-q="${q}"] input`); if (again) again.focus();
    return;
  }
  if (e.target.classList.contains('sadd')) {
    const tid = e.target.dataset.tid, t = S.tasks[tid], inp = e.target.querySelector('input'), v = inp.value.trim();
    if (!t || !v) return;
    t.subtasks = [...(t.subtasks || []), { id: newId(), t: v, done: false }]; saveTask(t);
    renderAll();
    const again = $(`#view .sadd[data-tid="${CSS.escape(tid)}"] input`); if (again) again.focus();
    return;
  }
  if (e.target.id === 'addForm') {
    const title = $('#addTitle').value.trim(); if (!title) return;
    const t = addTask({ title, est: UI.addEst, tag: $('#addTag').value, important: UI.addQ ? UI.addQ <= 2 : null, urgentManual: UI.addQ === 1 || UI.addQ === 3, due: $('#addDue').value, today: $('#addToday').checked });
    $('#addTitle').value = ''; $('#addDue').value = ''; refreshAddQ();
    if (UI.addQ && t.q !== UI.addQ) toast(`“${t.title}” vào ${qLabel(t.q)} vì hạn chót.`);
    if (UI.tab === 'today' && !t.today) toast('Đã thêm vào “Tất cả việc”.');
    renderHello(); renderTabs(); renderTimer(); refreshLists(); $('#addTitle').focus();
    if (Object.keys(S.tasks).length === 1) { view.innerHTML = ''; renderView(); }
  }
  if (e.target.id === 'addQuote') {
    const t = $('#qText').value.trim(); if (!t) return;
    S.settings.customQuotes = [...(S.settings.customQuotes || []), { id: 'c' + newId(), t, by: $('#qBy').value.trim() }];
    saveSettings(); $('#qText').value = ''; $('#qBy').value = ''; view.innerHTML = viewSettings();
  }
});
view.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'noteSearch') { UI.noteQuery = el.value; $('#board').innerHTML = boardHtml(); }
});
view.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.sact === 'toggle') {
    const t = S.tasks[el.closest('.task').dataset.id], sub = (t.subtasks || []).find(x => x.id === el.closest('li').dataset.sid);
    if (!sub) return;
    sub.done = el.checked; saveTask(t);
    if (subProgress(t) === 100 && t.status !== 'done') toast(`Đã xong mọi bước của “${t.title}”. Bấm vòng tròn bên trái để đánh dấu hoàn thành.`);
    renderAll(); return;
  }
  if (el.id === 'tagFilter') { UI.tagFilter = el.value; renderView(); return; }
  if (el.id === 'addDue') { refreshAddQ(); return; }
  if (el.dataset.set) {
    const v = Math.round(+el.value); const min = +el.min, max = +el.max;
    if (!Number.isFinite(v) || v < min || v > max) { el.value = S.settings[el.dataset.set]; toast(`Giá trị phải từ ${min} đến ${max}.`); return; }
    S.settings[el.dataset.set] = v; saveSettings(); if (el.dataset.set === 'urgentDays') trackQuadrants(); renderTimer(); return;
  }
  if (el.id === 'set-autoBreak' || el.id === 'set-sound') { S.settings[el.id.slice(4)] = el.checked; saveSettings(); return; }
  if (el.dataset.themeK) {
    const k = el.dataset.themeK, th = new Set(S.settings.themes); el.checked ? th.add(k) : th.delete(k);
    S.settings.themes = [...th]; saveSettings(); return;
  }
});
// drawer events
const dr = $('#drawerRoot');
dr.addEventListener('click', e => {
  const t = S.tasks[drawerId]; if (!t) return;
  if (e.target.id === 'overlay' || e.target.id === 'dClose') { closeDrawer(); return; }
  const qo = e.target.closest('[data-qopen="d"]'); if (qo) { toggleQMenu(qo, 'd', quadOf(t)); return; }
  const qp = e.target.closest('[data-qpick^="d:"]'); if (qp) { setQuadrant(t, +qp.dataset.qpick.split(':')[1]); refreshDrawerQ(t); renderTimer(); return; }
  if (e.target.id === 'dDel') {
    const btn = e.target;
    if (btn.dataset.armed) deleteTask(t.id);
    else { btn.dataset.armed = '1'; btn.textContent = 'Bấm lần nữa để xoá hẳn'; setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = 'Xoá việc'; } }, 4000); }
    return;
  }
  const s = e.target.closest('[data-sub]'); if (!s) return;
  const li = s.closest('li'), sub = t.subtasks.find(x => x.id === li.dataset.sid);
  if (s.dataset.sub === 'toggle') { sub.done = s.checked; li.classList.toggle('done', sub.done); saveTask(t); }
  if (s.dataset.sub === 'del') { t.subtasks = t.subtasks.filter(x => x !== sub); saveTask(t); renderSubs(); }
});
dr.addEventListener('submit', e => {
  e.preventDefault(); const t = S.tasks[drawerId]; if (!t) return;
  const i = $('#dSubInput'), v = i.value.trim(); if (!v) return;
  t.subtasks = [...(t.subtasks || []), { id: newId(), t: v, done: false }]; saveTask(t); i.value = ''; renderSubs(); i.focus();
});
dr.addEventListener('input', e => {
  const t = S.tasks[drawerId]; if (!t) return; const el = e.target;
  if (el.id === 'dTitle') { t.title = el.value; saveTaskSoon(t); }
  else if (el.id === 'dNote') { t.note = el.value; t.noteAt = Date.now(); saveTaskSoon(t); }
  else if (el.dataset.sub === 'text') { const sub = t.subtasks.find(x => x.id === el.closest('li').dataset.sid); if (sub) { sub.t = el.value; saveTaskSoon(t); } }
});
dr.addEventListener('change', e => {
  const t = S.tasks[drawerId]; if (!t) return; const el = e.target;
  if (el.id === 'dEst') { const v = Math.max(0, Math.min(40, Math.round(+el.value || 0))); if (v !== t.est) { t.est = v; t.pomoMin = S.settings.focus; resetAlerts(t); } }
  else if (el.id === 'dTag') t.tag = el.value.trim();
  else if (el.id === 'dDue') { t.due = el.value; refreshDrawerQ(t); }
  else return;
  t.q = quadOf(t); saveTask(t); renderTimer();
});
const nr = $('#noteRoot');
nr.addEventListener('click', e => {
  const ed = UI.noteEdit; if (!ed) return;
  const el = e.target;
  if (el.id === 'nOverlay' || el.id === 'neClose') { closeNote(); return; }
  if (el.id === 'neOpenTask') { const id = ed.id; closeNote(); openDrawer(id); return; }
  const n = S.notes[ed.id]; if (!n) return;
  const sw = el.closest('[data-color]');
  if (sw) { n.color = sw.dataset.color; saveNote(n); $('#nSheet').className = `sheet-edit c-${n.color}`; $$('.sw', nr).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.color === n.color))); return; }
  if (el.id === 'nePin') { n.pinned = !n.pinned; saveNote(n); el.textContent = n.pinned ? 'Bỏ ghim' : 'Ghim lên đầu'; return; }
  if (el.id === 'neDel') {
    if (el.dataset.armed) { delete S.notes[n.id]; Store.save('note', n.id, null); UI.noteEdit = null; closeNote(); toast('Đã xoá tờ ghi chú.'); }
    else { el.dataset.armed = '1'; el.textContent = 'Bấm lần nữa để xoá'; setTimeout(() => { if (el.isConnected) { delete el.dataset.armed; el.textContent = 'Xoá'; } }, 4000); }
  }
});
nr.addEventListener('input', e => {
  const ed = UI.noteEdit; if (!ed) return; const el = e.target;
  if (el.id === 'neBody') autosize(el);
  if (ed.kind === 'task') {
    const t = S.tasks[ed.id]; if (!t || el.id !== 'neBody') return;
    t.note = el.value; t.noteAt = Date.now(); saveTaskSoon(t);
  } else {
    const n = S.notes[ed.id]; if (!n) return;
    if (el.id === 'neTitle') n.title = el.value; else if (el.id === 'neBody') n.body = el.value; else return;
    n.updatedAt = Date.now(); saveNoteSoon(n);
  }
  $('#neMeta').textContent = 'Đang lưu tự động';
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('.qmenu')) { $$('.qmenu').forEach(m => m.remove()); return; }
  if (e.key === 'Escape' && UI.noteEdit) { closeNote(); return; }
  if (e.key === 'Escape' && drawerId) { closeDrawer(); return; }
  if (e.code === 'Space' && !e.target.closest('input,textarea,select,button') && !drawerId && !UI.noteEdit) { e.preventDefault(); $('#btnMain').click(); }
});

/* ---------- sign-in screen (Vercel build only) ---------- */
function showLogin(auth, msg) {
  return new Promise(resolve => {
    const root = $('#loginRoot');
    root.innerHTML = `<div class="overlay center login-ov"><div class="login-card" role="dialog" aria-modal="true" aria-labelledby="lgH">
      <h2 id="lgH">Phiên Làm Việc</h2>
      <p>Đăng nhập để việc, ghi chú và lịch sử phiên được đồng bộ trên mọi thiết bị của bạn.</p>
      <button class="btn primary solid" id="lgBtn">Đăng nhập bằng Google</button>
      <p class="lg-msg" id="lgMsg">${esc(msg || '')}</p></div></div>`;
    const btn = $('#lgBtn'), out = $('#lgMsg');
    btn.addEventListener('click', async () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });
      btn.disabled = true; out.textContent = '';
      try { const r = await auth.signInWithPopup(provider); resolve(r.user); }
      catch (e) {
        btn.disabled = false;
        const c = e && e.code;
        if (c === 'auth/popup-blocked' || c === 'auth/operation-not-supported-in-this-environment') { out.textContent = 'Trình duyệt chặn cửa sổ đăng nhập, đang chuyển trang…'; auth.signInWithRedirect(provider); }
        else if (c === 'auth/unauthorized-domain') out.textContent = `Tên miền ${location.hostname} chưa được thêm vào Firebase. Vào Authentication → Settings → Authorized domains để thêm.`;
        else if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') out.textContent = 'Bạn đã đóng cửa sổ đăng nhập. Bấm lại để thử lần nữa.';
        else out.textContent = 'Chưa đăng nhập được: ' + (e && e.message ? e.message : 'lỗi không rõ');
      }
    });
  });
}
function hideLogin() { const r = $('#loginRoot'); if (r) r.innerHTML = ''; }

/* ---------- backup: export / import ---------- */
function exportData() {
  return JSON.stringify({ app: 'phien-lam-viec', v: 1, at: new Date().toISOString(), tasks: S.tasks, notes: S.notes, inbox: S.inbox, settings: S.settings, days: S.days });
}
function importData(txt) {
  let o;
  try { o = JSON.parse(txt); } catch (e) { throw new Error('Đoạn dán vào không đúng định dạng. Hãy sao chép lại toàn bộ đoạn đã xuất.'); }
  if (!o || o.app !== 'phien-lam-viec') throw new Error('Đây không phải dữ liệu xuất từ Phiên Làm Việc.');
  let n = { tasks: 0, notes: 0, days: 0 };
  Object.values(o.tasks || {}).forEach(t => { if (t && t.id) { S.tasks[t.id] = t; saveTask(t); n.tasks++; } });
  Object.values(o.notes || {}).forEach(x => { if (x && x.id) { S.notes[x.id] = x; saveNote(x); n.notes++; } });
  Object.entries(o.days || {}).forEach(([d, day]) => {
    if (!day || !Array.isArray(day.sessions)) return;
    const cur = S.days[d];
    if (cur) { const seen = new Set(cur.sessions.map(s => s.start + ':' + s.taskId)); day.sessions.forEach(s => { if (!seen.has(s.start + ':' + s.taskId)) cur.sessions.push(s); }); }
    else S.days[d] = { date: d, sessions: day.sessions };
    Store.save('day', d, S.days[d]); n.days++;
  });
  if (Array.isArray(o.inbox)) { const ids = new Set(S.inbox.map(i => i.id)); o.inbox.forEach(i => { if (!ids.has(i.id)) S.inbox.push(i); }); saveInbox(); }
  if (o.settings) { S.settings = Object.assign(clone(DEFAULT_SETTINGS), o.settings); saveSettings(); }
  Object.values(S.tasks).forEach(t => { migrateTask(t); t.q = quadOf(t); });
  return n;
}

/* ---------- pick up changes made on another device ---------- */
async function refreshFromRemote() {
  if (!Store.remote() || !Store.idle() || drawerId || UI.noteEdit) return;
  const a = document.activeElement;
  if (a && a.matches('input,textarea') && a.value) return;
  try {
    await Store.loadRemote();
    Object.values(S.tasks).forEach(t => migrateTask(t));
    renderAll();
  } catch (e) { console.warn('refresh failed', e); }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refreshFromRemote(); });

/* ---------- boot ---------- */
async function boot() {
  pickQuote();
  renderAll();
  await Store.init();
  setSaved('ok');
  Object.values(S.tasks).forEach(t => { if (migrateTask(t)) saveTask(t); });
  trackQuadrants();
  if (UI.quote) pickQuote();
  // A timer that ran out while the page was closed: close it out once.
  const tm = S.timer;
  if (tm.running && !tm.pausedAt && remaining() <= 0) {
    if (tm.mode === 'focus') { endFocus(true, '', true); toast('Phiên tập trung đã kết thúc trong lúc trang đóng và đã được ghi lại.'); }
    else endBreak(true);
  }
  renderAll();
  setInterval(() => tick(false), 250);
  setInterval(() => { trackQuadrants(); }, 60000);
}
boot();
})();
